name: Update report

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      BUG_STATS_URL: ${{ secrets.BUG_STATS_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'character()'
          extra-packages: |
            any::dplyr
            any::httr2
            any::jsonlite
            any::purrr
            any::readr
            any::stringr
            any::tibble
            any::xml2

      - name: Download Bugzilla data
        run: |
          curl -L "$BUG_STATS_URL" -o bug-stats.tar.gz
          mkdir bug-stats
          tar -xzf bug-stats.tar.gz -C bug-stats

      - name: Generate report
        run: Rscript R/update-report.R bug-stats

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/
          git diff --cached --quiet && exit 0
          git commit -m "Update triage report"
          git push